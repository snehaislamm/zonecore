name: ci

on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-tidy
          pip install numpy pytest matplotlib
      - name: DBC codegen up to date
        run: python3 tools/dbcgen.py can/zonecore.dbc include/zc/zc_can_db.h src/com/zc_can_db.c --check
      - name: Build (-Werror)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build -j
      - name: Static analysis (clang-tidy)
        run: clang-tidy -p build --quiet src/*/*.c
      - name: Unit tests
        run: ./build/zc_unit_tests
      - name: SIL tests
        run: python3 -m pytest tests/sil -q
      - name: Traceability gate
        run: python3 tools/trace.py --strict
